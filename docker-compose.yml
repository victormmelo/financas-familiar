services:
  postgres:
    image: postgres:16-alpine
    container_name: financas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financas_password}
      POSTGRES_DB: ${POSTGRES_DB:-financas_familiar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financas} -d ${POSTGRES_DB:-financas_familiar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financas_network

  redis:
    image: redis:7-alpine
    container_name: financas_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - financas_network

  minio:
    image: minio/minio:latest
    container_name: financas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - financas_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: financas_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - financas_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  financas_network:
    driver: bridge
