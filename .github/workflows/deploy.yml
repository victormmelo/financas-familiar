      #     script: |
      #       cd /opt/financas-familiar
      #       echo "${{ secrets.GITHUB_TOKEN }}" | \
      #         docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #       docker compose pull
      #       docker compose run --rm api \
      #         npx prisma migrate deploy --schema=prisma/schema.prisma
      #       docker compose up -d --remove-orphans
      #       docker system prune -f

      # ── Opção B: Railway (deploy webhook) ─────────────────────────────────
      # Secret necessário: RAILWAY_WEBHOOK_URL
      #
      # - name: Trigger Railway deploy
      #   run: curl -fsSL -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}"

      # ── Opção C: Fly.io ────────────────────────────────────────────────────
      # Secret necessário: FLY_API_TOKEN
      # Requer fly.toml em apps/api/ e apps/web/
      #
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - name: Deploy API
